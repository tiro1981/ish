<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UzMardikor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        /* --- 4. DIZAYN VA DARK MODE (EditAdScreen dagi muammo hal qilindi) --- */
        :root {
            --primary: #FFA500; /* Sabzirang */
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --text-main: #000000;
            --text-sub: #888888;
            --input-bg: #F0F0F0; /* Input foni */
            --border: #E5E7EB;
            --green: #4CAF50;
            --red: #FF5252;
        }

        /* Dark Mode uchun o'zgaruvchilar */
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-main: #FFFFFF;
            --text-sub: #AAAAAA;
            --input-bg: #2C2C2C; /* Qorong'u input foni (TUZATILDI) */
            --border: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0; padding: 0;
            padding-bottom: 80px; /* Bottom Nav joyi */
            transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        /* UI ELEMENTLARI */
        .screen { display: none; animation: fade 0.3s; }
        .screen.active { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        .app-bar {
            padding: 15px 20px;
            background: var(--bg-color);
            position: sticky; top: 0; z-index: 50;
            display: flex; justify-content: space-between; align-items: center;
        }

        /* 2. FILTERLASH VA QIDIRUV (HomeScreen) */
        .search-area { padding: 0 20px 10px; display: flex; gap: 10px; }
        .search-box {
            flex: 1; background: var(--input-bg); border-radius: 12px;
            padding: 0 15px; display: flex; align-items: center; height: 50px;
        }
        .search-box input {
            border: none; background: transparent; width: 100%; height: 100%;
            margin-left: 10px; outline: none; color: var(--text-main); font-size: 16px;
        }
        .filter-btn {
            width: 50px; height: 50px; background: var(--primary);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer;
        }

        /* E'LON KARTASI (JobCard) */
        .card {
            background: var(--card-bg); margin: 10px 20px; padding: 15px;
            border-radius: 16px; position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        /* Saqlash tugmasi (Yurakcha) */
        .bookmark-btn {
            position: absolute; top: 15px; right: 15px;
            color: var(--text-sub); cursor: pointer; z-index: 2;
        }
        .bookmark-btn.saved { color: var(--primary); } /* Bosilganda rangi o'zgaradi */

        .card-header { display: flex; gap: 15px; margin-bottom: 10px; }
        .icon-box {
            width: 45px; height: 45px; background: rgba(255, 165, 0, 0.15);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            color: var(--primary);
        }
        .price { color: var(--green); font-weight: bold; }
        
        /* 1. BATAFSIL OYNASI (JobDetailsScreen) */
        #details-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 100; overflow-y: auto;
        }
        .details-cover { height: 200px; background: #555; position: relative; }
        .back-btn {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.4); color: white;
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .details-content {
            background: var(--bg-color); border-radius: 25px 25px 0 0;
            margin-top: -25px; position: relative; padding: 25px;
        }
        /* Bloklarga ajratilgan ma'lumotlar */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .info-item {
            background: var(--input-bg); padding: 15px; border-radius: 12px; text-align: center;
        }
        .info-label { font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 5px; }
        .info-value { font-weight: bold; color: var(--text-main); }

        /* 3. CHAT VA SAQLANGANLAR (ChatScreen) */
        .tabs { display: flex; padding: 0 20px; margin-bottom: 15px; }
        .tab {
            flex: 1; text-align: center; padding: 10px;
            color: var(--text-sub); border-bottom: 2px solid transparent; cursor: pointer;
        }
        .tab.active { color: var(--primary); border-color: var(--primary); font-weight: bold; }

        /* Delete tugmasi (Saqlanganlar uchun) */
        .delete-btn { color: var(--red); cursor: pointer; }

        /* NAVIGATION */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: var(--card-bg); height: 65px; border-radius: 20px;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .nav-icon { color: #BBB; font-size: 28px; cursor: pointer; }
        .nav-icon.active { color: var(--primary); }
        .add-fab {
            width: 55px; height: 55px; background: var(--primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: white; margin-top: -30px; box-shadow: 0 4px 10px rgba(255,165,0,0.4);
        }

        /* FILTER MODAL */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end;
        }
        .modal-content {
            background: var(--card-bg); width: 100%; padding: 25px;
            border-radius: 25px 25px 0 0; animation: slideUp 0.3s;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        select { width: 100%; padding: 15px; background: var(--input-bg); border: none; border-radius: 12px; color: var(--text-main); font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active">
        <div class="app-bar">
            <h2>UzMardikor</h2>
            <span class="material-icons-round" onclick="toggleTheme()">brightness_4</span>
        </div>

        <div class="search-area">
            <div class="search-box">
                <span class="material-icons-round" style="color: #888;">search</span>
                <input type="text" id="searchInput" placeholder="Ish qidirish..." onkeyup="applyFilters()">
            </div>
            <div class="filter-btn" onclick="openFilter()">
                <span class="material-icons-round">tune</span>
            </div>
        </div>

        <div style="padding: 10px 20px; font-weight: bold;">
            Natijalar: <span id="count" style="font-weight: normal; color: var(--text-sub);">0</span>
        </div>

        <div id="jobList" style="padding-bottom: 20px;"></div>
    </div>

    <div id="chat-screen" class="screen">
        <div class="app-bar" style="justify-content: center;">
            <h3>Xabarlar</h3>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('chats', this)">Suhbatlar</div>
            <div class="tab" onclick="switchTab('saved', this)">Saqlanganlar</div>
        </div>

        <div id="chats-content">
            <div style="text-align: center; margin-top: 50px; color: var(--text-sub);">Suhbatlar yo'q</div>
        </div>

        <div id="saved-content" style="display: none;">
            <div id="savedList" style="padding-bottom: 20px;"></div>
        </div>
    </div>

    <div id="details-screen" class="screen">
        <div class="details-cover" style="background-image: url('https://source.unsplash.com/random/800x600/?worker'); background-size: cover;">
            <div class="back-btn" onclick="closeDetails()">
                <span class="material-icons-round">arrow_back</span>
            </div>
        </div>
        <div class="details-content">
            <div style="display: flex; justify-content: space-between; align-items: start;">
                <h2 id="dt-title" style="margin: 0;">Sarlavha</h2>
                <span id="dt-bookmark" class="material-icons-round" style="font-size: 30px; color: var(--text-sub); cursor: pointer;" onclick="toggleBookmarkFromDetails()">bookmark_border</span>
            </div>
            
            <div class="info-grid">
                <div class="info-item">
                    <span class="info-label">Narx</span>
                    <span class="info-value" id="dt-price" style="color: var(--green);">0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Manzil</span>
                    <span class="info-value" id="dt-location">Manzil</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Vaqt</span>
                    <span class="info-value" id="dt-time">Vaqt</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Kategoriya</span>
                    <span class="info-value" id="dt-cat">Ish</span>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 15px; margin-top: 20px; padding: 15px; border: 1px solid var(--border); border-radius: 15px;">
                <div style="width: 40px; height: 40px; background: #ddd; border-radius: 50%;"></div>
                <div>
                    <div style="font-weight: bold;">Alijon Valiyev</div>
                    <div style="font-size: 13px; color: var(--primary);">Profilga o'tish</div>
                </div>
            </div>
            
            <br><br><br>
        </div>
    </div>

    <div id="filterModal" class="modal" onclick="if(event.target == this) closeFilter()">
        <div class="modal-content">
            <h3>Filtrlash</h3>
            <p style="margin-bottom: 5px; color: var(--text-sub);">Hudud</p>
            <select id="regionSelect" onchange="applyFilters()">
                <option value="">Barchasi</option>
                <option value="Toshkent">Toshkent</option>
                <option value="Samarqand">Samarqand</option>
                <option value="Andijon">Andijon</option>
            </select>
            <br><br>
            <button onclick="closeFilter()" style="width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold;">Yopish</button>
        </div>
    </div>

    <div class="bottom-nav">
        <span class="material-icons-round nav-icon active" onclick="nav('home', this)">home</span>
        <span class="material-icons-round nav-icon" onclick="nav('chat', this)">chat_bubble</span>
        <div class="add-fab" onclick="Telegram.WebApp.showAlert('Tez orada...')">
            <span class="material-icons-round">add</span>
        </div>
        <span class="material-icons-round nav-icon" onclick="nav('ads', this)">assignment</span>
        <span class="material-icons-round nav-icon" onclick="nav('profile', this)">person</span>
    </div>

    <script>
        // 5. MA'LUMOTLAR BAZASI (job_data.dart o'rniga)
        const jobsDB = [
            { id: 1, title: "G'isht teruvchi", location: "Toshkent", price: "250,000", time: "1 soat", cat: "Qurilish" },
            { id: 2, title: "Yuk tashish", location: "Samarqand", price: "100,000", time: "3 soat", cat: "Logistika" },
            { id: 3, title: "Santexnik", location: "Andijon", price: "Kelishilgan", time: "Kecha", cat: "Usta" },
            { id: 4, title: "Elektrik", location: "Toshkent", price: "300,000", time: "Bugun", cat: "Usta" }
        ];

        // SAVED JOBS (Bazaga yozadi degan joyi - LocalStorage ishlatamiz)
        let savedIDs = JSON.parse(localStorage.getItem('savedJobs') || '[]');

        // INIT
        const tg = window.Telegram.WebApp;
        tg.expand();
        // 4. DARK MODE INIT
        if (tg.colorScheme === 'dark') document.body.setAttribute('data-theme', 'dark');

        renderHome();

        // --- FUNKSIYALAR ---

        // 2. HOME EKRANINI CHIZISH (Filter bilan)
        function renderHome() {
            const list = document.getElementById('jobList');
            list.innerHTML = "";
            
            // Filterlash
            const q = document.getElementById('searchInput').value.toLowerCase();
            const region = document.getElementById('regionSelect').value;

            const filtered = jobsDB.filter(j => {
                const matchTitle = j.title.toLowerCase().includes(q);
                const matchRegion = region === "" || j.location === region;
                return matchTitle && matchRegion;
            });

            document.getElementById('count').innerText = filtered.length;

            filtered.forEach(job => {
                const isSaved = savedIDs.includes(job.id);
                // 2. YURAKCHA TUGMASI LOGIKASI
                const card = `
                    <div class="card" onclick="openDetails(${job.id})">
                        <span class="material-icons-round bookmark-btn ${isSaved ? 'saved' : ''}" 
                              onclick="event.stopPropagation(); toggleSave(${job.id})">
                              ${isSaved ? 'bookmark' : 'bookmark_border'}
                        </span>
                        <div class="card-header">
                            <div class="icon-box"><span class="material-icons-round">work</span></div>
                            <div>
                                <h3 style="margin:0;">${job.title}</h3>
                                <small style="color:var(--text-sub);">${job.location}</small>
                            </div>
                        </div>
                        <div style="display:flex; justify-content:space-between; font-size:14px;">
                            <span style="color:var(--text-sub);">${job.time} oldin</span>
                            <span class="price">${job.price}</span>
                        </div>
                    </div>
                `;
                list.innerHTML += card;
            });
        }

        // 2. FILTRNI ISHLATISH
        function applyFilters() { renderHome(); }
        function openFilter() { document.getElementById('filterModal').style.display = 'flex'; }
        function closeFilter() { document.getElementById('filterModal').style.display = 'none'; }

        // 1 & 2. SAQLASH LOGIKASI (Toggle Save)
        function toggleSave(id) {
            if (savedIDs.includes(id)) {
                savedIDs = savedIDs.filter(x => x !== id); // O'chirish
            } else {
                savedIDs.push(id); // Qo'shish
            }
            localStorage.setItem('savedJobs', JSON.stringify(savedIDs));
            renderHome(); // Uyni yangilash
            renderSavedTab(); // Saqlanganlar tabini yangilash
        }

        // 1. BATAFSIL OYNASI (Details Screen)
        let currentDetailId = null;
        function openDetails(id) {
            currentDetailId = id;
            const job = jobsDB.find(j => j.id === id);
            
            document.getElementById('dt-title').innerText = job.title;
            document.getElementById('dt-price').innerText = job.price;
            document.getElementById('dt-location').innerText = job.location;
            document.getElementById('dt-time').innerText = job.time;
            document.getElementById('dt-cat').innerText = job.cat;

            // Bookmark iconini to'g'irlash
            const isSaved = savedIDs.includes(id);
            const bmBtn = document.getElementById('dt-bookmark');
            bmBtn.innerText = isSaved ? 'bookmark' : 'bookmark_border';
            bmBtn.style.color = isSaved ? 'var(--primary)' : 'var(--text-sub)';

            document.getElementById('details-screen').style.display = 'block';
        }
        
        function closeDetails() {
            document.getElementById('details-screen').style.display = 'none';
        }

        function toggleBookmarkFromDetails() {
            if(currentDetailId) {
                toggleSave(currentDetailId);
                // Iconni yangilash
                const isSaved = savedIDs.includes(currentDetailId);
                const bmBtn = document.getElementById('dt-bookmark');
                bmBtn.innerText = isSaved ? 'bookmark' : 'bookmark_border';
                bmBtn.style.color = isSaved ? 'var(--primary)' : 'var(--text-sub)';
            }
        }

        // 3. CHAT EKRANI (Tablar)
        function switchTab(tabName, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');

            if (tabName === 'chats') {
                document.getElementById('chats-content').style.display = 'block';
                document.getElementById('saved-content').style.display = 'none';
            } else {
                document.getElementById('chats-content').style.display = 'none';
                document.getElementById('saved-content').style.display = 'block';
                renderSavedTab();
            }
        }

        // 3. SAQLANGANLAR RO'YXATI VA DELETE
        function renderSavedTab() {
            const list = document.getElementById('savedList');
            list.innerHTML = "";
            const savedItems = jobsDB.filter(j => savedIDs.includes(j.id));

            if(savedItems.length === 0) {
                list.innerHTML = "<div style='text-align:center; margin-top:20px; color:var(--text-sub)'>Bo'sh</div>";
                return;
            }

            savedItems.forEach(job => {
                const card = `
                    <div class="card" onclick="openDetails(${job.id})">
                        <div class="card-header">
                            <div class="icon-box"><span class="material-icons-round">bookmark</span></div>
                            <div style="flex:1;">
                                <h3 style="margin:0;">${job.title}</h3>
                                <small style="color:var(--text-sub);">${job.price}</small>
                            </div>
                            <span class="material-icons-round delete-btn" 
                                  onclick="event.stopPropagation(); toggleSave(${job.id})">
                                  delete_outline
                            </span>
                        </div>
                    </div>
                `;
                list.innerHTML += card;
            });
        }

        // NAVIGATION
        function nav(screen, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screen + '-screen').classList.add('active');
            
            document.querySelectorAll('.nav-icon').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
        }
        
        // 4. THEME TOGGLE (Qo'lda o'zgartirish uchun)
        function toggleTheme() {
            if(document.body.getAttribute('data-theme') === 'dark') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', 'dark');
            }
        }
    </script>
</body>
</html>
