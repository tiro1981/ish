<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>UzMardikor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        :root {
            --primary: #FFA500;
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --text-color: #000000;
            --text-secondary: #888888;
            --input-bg: #F0F0F0;
            --border-color: #E5E7EB;
        }

        /* DARK MODE */
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-color: #FFFFFF;
            --text-secondary: #AAAAAA;
            --input-bg: #2C2C2C;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 80px; /* Menyu uchun joy */
            transition: background 0.3s, color 0.3s;
        }

        /* HEADER */
        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .app-title h1 { margin: 0; font-size: 22px; font-weight: 800; }
        .app-title p { margin: 0; font-size: 13px; color: var(--text-secondary); }

        /* SEARCH & FILTER */
        .search-bar {
            padding: 0 20px;
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1;
            background: var(--input-bg);
            border-radius: 15px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
        }
        .search-input input {
            border: none;
            background: transparent;
            width: 100%;
            margin-left: 10px;
            font-size: 16px;
            color: var(--text-color);
            outline: none;
        }
        .filter-btn {
            background: var(--primary);
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 165, 0, 0.3);
        }

        /* LIST */
        .list-header {
            padding: 20px 20px 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        #job-list { padding: 0 20px; }

        /* JOB CARD */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .card-top { display: flex; gap: 15px; }
        .icon-box {
            width: 50px; height: 50px;
            background: rgba(255, 165, 0, 0.15);
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary);
        }
        .card-info h3 { margin: 0 0 5px; font-size: 16px; }
        .location { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
        .divider { height: 1px; background: var(--border-color); margin: 15px 0; }
        .card-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .price { color: #00C853; font-weight: 800; font-size: 16px; }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 20px; left: 20px; right: 20px;
            background: var(--card-bg);
            height: 70px;
            border-radius: 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .nav-item { color: #CCCCCC; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .add-btn {
            width: 55px; height: 55px;
            background: linear-gradient(135deg, #FFA500, #FF4500);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 69, 0, 0.4);
            margin-top: -30px;
        }

        /* SCREENS */
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* MODAL (FILTER) */
        .modal {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0; top: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: flex-end;
        }
        .modal-content {
            background: var(--card-bg);
            width: 100%;
            border-radius: 25px 25px 0 0;
            padding: 25px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        /* CHIPS */
        .chips { display: flex; gap: 10px; margin: 10px 0 20px; }
        .chip {
            padding: 8px 15px;
            background: var(--input-bg);
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        .chip.active { background: var(--primary); color: white; }

        .btn {
            background: var(--primary); color: white; border: none;
            padding: 15px; width: 100%; border-radius: 15px; font-weight: bold; font-size: 16px;
        }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active">
        <header>
            <div class="app-title">
                <h1>UzMardikor</h1>
                <p>Toshkent, O'zbekiston</p>
            </div>
            <span class="material-icons-round" onclick="toggleTheme()" style="cursor: pointer;">brightness_4</span>
        </header>

        <div class="search-bar">
            <div class="search-input">
                <span class="material-icons-round" style="color: #888;">search</span>
                <input type="text" id="searchInput" placeholder="Ish qidirish..." onkeyup="filterJobs()">
            </div>
            <div class="filter-btn" onclick="openFilter()">
                <span class="material-icons-round">tune</span>
            </div>
        </div>

        <div class="list-header">
            <span>So'nggi e'lonlar</span>
            <span style="color: #888; font-weight: normal;" id="resultCount">0 ta natija</span>
        </div>

        <div id="job-list">
            </div>
    </div>

    <div id="chat-screen" class="screen" style="padding: 20px; text-align: center;">
        <h2>Xabarlar markazi</h2>
        <p style="color: #888;">Hozircha xabarlar yo'q</p>
    </div>

    <div id="profile-screen" class="screen" style="padding: 20px; text-align: center;">
        <div style="width: 100px; height: 100px; background: #ddd; border-radius: 50%; margin: 20px auto; background-image: url('https://i.pravatar.cc/300'); background-size: cover;"></div>
        <h2>Hikmatillo Karimov</h2>
        <p>+998 90 123 45 67</p>
        <button class="btn" style="background: red; margin-top: 20px;">Chiqish</button>
    </div>

    <div class="bottom-nav">
        <span class="material-icons-round nav-item active" onclick="switchTab('home', this)">home</span>
        <span class="material-icons-round nav-item" onclick="switchTab('chat', this)">chat_bubble</span>
        <div class="add-btn" onclick="Telegram.WebApp.showAlert('E\'lon qo\'shish hozircha ishlamaydi')">
            <span class="material-icons-round">add</span>
        </div>
        <span class="material-icons-round nav-item" onclick="switchTab('ads', this)">assignment_ind</span>
        <span class="material-icons-round nav-item" onclick="switchTab('profile', this)">person</span>
    </div>

    <div id="filterModal" class="modal" onclick="if(event.target == this) closeFilter()">
        <div class="modal-content">
            <h3>Filtrlash</h3>
            <p>Hudud</p>
            <select id="regionSelect" style="width: 100%; padding: 10px; border-radius: 10px; background: var(--input-bg); color: var(--text-color); border: none;">
                <option value="all">Barchasi</option>
                <option value="Toshkent">Toshkent</option>
                <option value="Samarqand">Samarqand</option>
                <option value="Andijon">Andijon</option>
            </select>

            <p>Ish turi</p>
            <div class="chips">
                <div class="chip active" onclick="selectChip(this)">Barchasi</div>
                <div class="chip" onclick="selectChip(this)">Kunlik</div>
                <div class="chip" onclick="selectChip(this)">Soatlik</div>
            </div>

            <button class="btn" onclick="applyFilter()">Ko'rsatish</button>
        </div>
    </div>

    <script>
        // MA'LUMOTLAR BAZASI
        const jobs = [
            { title: "G'isht teruvchi", location: "Toshkent, Chilonzor", price: "250,000 so'm", time: "1 soat oldin" },
            { title: "Yuk tushirish", location: "Toshkent, Sergeli", price: "100,000 so'm", time: "3 soat oldin" },
            { title: "Santexnik", location: "Andijon, Markaz", price: "Kelishilgan", time: "Kecha" },
            { title: "Elektrik ustasi", location: "Samarqand", price: "300,000 so'm", time: "Hozirgina" }
        ];

        // Telegramni ishga tushirish
        const tg = window.Telegram.WebApp;
        tg.expand(); // To'liq ekran

        // Dastur yuklanganda
        window.onload = () => {
            renderJobs(jobs);
            
            // Tizim mavzusini aniqlash
            if (tg.colorScheme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
            }
        };

        // E'lonlarni chizish
        function renderJobs(data) {
            const list = document.getElementById('job-list');
            document.getElementById('resultCount').innerText = data.length + " ta natija";
            list.innerHTML = "";

            data.forEach(job => {
                const card = `
                    <div class="card" onclick="tg.showAlert('${job.title}')">
                        <div class="card-top">
                            <div class="icon-box"><span class="material-icons-round">work</span></div>
                            <div class="card-info">
                                <h3>${job.title}</h3>
                                <div class="location">
                                    <span class="material-icons-round" style="font-size: 14px;">location_on</span>
                                    ${job.location}
                                </div>
                            </div>
                        </div>
                        <div class="divider"></div>
                        <div class="card-bottom">
                            <span style="color: var(--text-secondary);">${job.time}</span>
                            <span class="price">${job.price}</span>
                        </div>
                    </div>
                `;
                list.innerHTML += card;
            });
        }

        // Qidiruv
        function filterJobs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = jobs.filter(j => 
                j.title.toLowerCase().includes(query) || 
                j.location.toLowerCase().includes(query)
            );
            renderJobs(filtered);
        }

        // Tablar (Menyu)
        function switchTab(screenName, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenName + '-screen').classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        // Dark Mode
        function toggleTheme() {
            if (document.body.hasAttribute('data-theme')) {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', 'dark');
            }
        }

        // Filter Modal
        function openFilter() { document.getElementById('filterModal').style.display = 'flex'; }
        function closeFilter() { document.getElementById('filterModal').style.display = 'none'; }
        
        function selectChip(el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
        }

        function applyFilter() {
            // Oddiy filter logikasi
            const region = document.getElementById('regionSelect').value;
            let filtered = jobs;
            
            if(region !== 'all') {
                filtered = jobs.filter(j => j.location.includes(region));
            }
            
            renderJobs(filtered);
            closeFilter();
        }
    </script>
</body>
</html>
