<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taksi Xizmati</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-color: #00d9ff; --secondary-color: #0099ff;
            --bg-dark: #0a0e27; --bg-card: rgba(20, 25, 45, 0.8);
            --text-primary: #ffffff; --text-secondary: #a0a8c0;
            --shadow: 0 8px 32px rgba(0, 217, 255, 0.15); --radius: 20px;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
            color: var(--text-primary); min-height: 100vh; padding-bottom: 80px; overflow-x: hidden;
        }
        .bg-particles .particle {
            position: absolute; background: radial-gradient(circle, var(--primary-color) 0%, transparent 70%);
            border-radius: 50%; opacity: 0.1; animation: float 20s infinite ease-in-out;
        }
        @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(30px, -30px); } }
        
        .container { position: relative; z-index: 1; max-width: 500px; margin: 0 auto; padding: 20px; }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .header { margin-bottom: 30px; text-align: center; }
        .header h1 { font-size: 28px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .card { background: var(--bg-card); backdrop-filter: blur(20px); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); border: 1px solid rgba(0, 217, 255, 0.1); margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; }
        .form-input { width: 100%; padding: 16px; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(0, 217, 255, 0.2); border-radius: 16px; color: #fff; font-size: 16px; transition: 0.3s; }
        .form-input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 20px rgba(0, 217, 255, 0.2); }

        .counter { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 10px 20px; border: 2px solid rgba(0, 217, 255, 0.2); }
        .counter-btn { width: 40px; height: 40px; background: var(--primary-color); border: none; border-radius: 10px; color: #000; font-weight: bold; cursor: pointer; }

        .btn-primary { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border: none; border-radius: 16px; color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 25px rgba(0, 217, 255, 0.3); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20, 25, 45, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(0, 217, 255, 0.2); padding: 12px 0; z-index: 100; }
        .nav-container { display: flex; justify-content: space-around; max-width: 500px; margin: 0 auto; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); cursor: pointer; font-size: 12px; transition: 0.3s; }
        .nav-item.active { color: var(--primary-color); }
        .nav-icon { font-size: 24px; }

        /* Profil uchun */
        .avatar { width: 80px; height: 80px; background: var(--primary-color); border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .profile-btn { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,217,255,0.2); border-radius: 12px; color: #fff; text-align: left; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="bg-particles"><div class="particle" style="width:300px; height:300px; top:-150px; left:-150px;"></div></div>

    <div class="container">
        <div id="home" class="page active">
            <div class="header"><h1>Taksi chaqirish</h1><p>Tez va qulay xizmat</p></div>
            <div class="card">
                <form id="orderForm">
                    <div class="form-group">
                        <label class="form-label">📍 Qayerdan</label>
                        <input type="text" id="pickupLocation" class="form-input" placeholder="Manzilni kiriting" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">🏁 Qayerga</label>
                        <input type="text" id="destination" class="form-input" placeholder="Borish manzili" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">👥 Yo'lovchilar soni</label>
                        <div class="counter">
                            <button type="button" class="counter-btn" id="decreaseBtn">−</button>
                            <span id="passengerCount">1</span>
                            <button type="button" class="counter-btn" id="increaseBtn">+</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">📞 Telefon</label>
                        <input type="tel" id="phoneNumber" class="form-input" placeholder="+998 90 123 45 67" required>
                    </div>
                    <button type="submit" class="btn-primary">Buyurtma berish</button>
                </form>
            </div>
        </div>

        <div id="history" class="page">
            <div class="header"><h1>Tarix</h1><p>Sizning buyurtmalaringiz</p></div>
            <div id="historyList">
                <div class="card" style="padding: 15px;">
                    <p style="font-size: 14px; color: var(--text-secondary);">Hozircha buyurtmalar yo'q</p>
                </div>
            </div>
        </div>

        <div id="profile" class="page">
            <div class="header"><h1>Profil</h1></div>
            <div class="card" style="text-align: center;">
                <div class="avatar">👤</div>
                <h3 id="userName">Foydalanuvchi</h3>
                <p id="userStatus" style="color: var(--primary-color); font-size: 12px;">Mijoz</p>
                <div style="margin-top: 20px;">
                    <button class="profile-btn">💳 To'lov usullari</button>
                    <button class="profile-btn">⚙️ Sozlamalar</button>
                    <button class="profile-btn" style="color: #ff4c4c; border-color: rgba(255,76,76,0.2);">🚪 Chiqish</button>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-container">
            <div class="nav-item active" onclick="showPage('home', this)">
                <div class="nav-icon">🏠</div><div class="nav-label">Asosiy</div>
            </div>
            <div class="nav-item" onclick="showPage('history', this)">
                <div class="nav-icon">📜</div><div class="nav-label">Tarix</div>
            </div>
            <div class="nav-item" onclick="showPage('profile', this)">
                <div class="nav-icon">👤</div><div class="nav-label">Profil</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Sahifalar navigatsiyasi
        function showPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            element.classList.add('active');
        }

        // Yo'lovchi soni
        let count = 1;
        document.getElementById('increaseBtn').onclick = () => { if(count < 6) count++; updateCount(); };
        document.getElementById('decreaseBtn').onclick = () => { if(count > 1) count--; updateCount(); };
        function updateCount() { document.getElementById('passengerCount').innerText = count; }

        // Botga yuborish
        document.getElementById('orderForm').onsubmit = (e) => {
            e.preventDefault();
            const data = {
                pickup: document.getElementById('pickupLocation').value,
                to: document.getElementById('destination').value,
                count: count,
                phone: document.getElementById('phoneNumber').value
            };
            tg.sendData(json.stringify(data));
        };

        // Telegram foydalanuvchi ismini chiqarish
        if(tg.initDataUnsafe.user) {
            document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
        }
    </script>
</body>
</html>
